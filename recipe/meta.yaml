{% set name = "pyproject_hooks" %}
{% set version = "1.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pyproject_hooks-{{ version }}.tar.gz
  sha256: 1e859bd5c40fae9448642dd871adf459e5e2084186e8d2c2a79a824c970da1f8

build:
  skip: true  # [py<37]
  script: {{ PYTHON }} -m pip install . -vv --no-deps
  number: 0

requirements:
  host:
    - python
    - pip
    - flit-core >=3.2,<4
  run:
    - python
    - tomli >=1.1.0  # [py<311]

test:
  imports:
    - pyproject_hooks
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://pypi.org/project/pyproject_hooks/
  summary: Wrappers to call pyproject.toml-based build backend hooks.
  description: |
    This is a low-level library for calling build-backends
    in pyproject.toml-based project. It provides the basic functionality
    to help write tooling that generates distribution files from Python projects.
  dev_url: https://github.com/pypa/pyproject-hooks
  license: MIT
  license_file:
    - LICENSE
  license_family: MIT
  doc_url: https://pyproject-hooks.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - theAeon
